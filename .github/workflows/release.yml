name: Release

# Automatically publishes a GitHub Release whenever a "vX.Y.Z" tag is pushed.
# Can also be re-run manually from the Actions tab for an existing tag.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.10.0)"
        required: true

permissions:
  contents: write

# Avoid two runs racing to publish the same tag (e.g. tag push + manual re-run)
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Nothing gets published unless the scripts parse, lint clean, and behave
  # sanely when run. A broken release is much more annoying than a failed tag.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check syntax
        run: |
          for f in lib.sh setup.sh download.sh; do
            bash -n "$f"
          done

      - name: ShellCheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y shellcheck
          fi
          shellcheck --version
          shellcheck lib.sh setup.sh download.sh

      - name: Both scripts answer --help
        run: |
          bash setup.sh --help
          bash download.sh --help

      - name: Unknown options are rejected
        run: |
          for script in setup.sh download.sh; do
            if bash "$script" --not-a-real-option >/dev/null 2>&1; then
              echo "::error::$script accepted an unknown option instead of failing"
              exit 1
            fi
          done

      # There is no bin/ in a fresh checkout, so this is the real behaviour a
      # user gets when they skip setup.sh: fail, and say what to run.
      - name: Missing binaries are reported, not ignored
        run: |
          if bash download.sh --quick "https://example.com/video" >/tmp/out.txt 2>&1; then
            echo "::error::download.sh ran despite bin/ being absent"
            exit 1
          fi
          grep -q "bash setup.sh" /tmp/out.txt || {
            echo "::error::download.sh did not point the user at setup.sh"
            cat /tmp/out.txt
            exit 1
          }

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve tag
        id: vars
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify lib.sh VERSION matches the tag
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          SCRIPT_VERSION=$(grep -oP 'readonly VERSION="\K[^"]+' lib.sh)
          if [[ "$TAG" != "$SCRIPT_VERSION" ]]; then
            echo "::error::Tag ($TAG) does not match VERSION in lib.sh ($SCRIPT_VERSION)"
            exit 1
          fi

      - name: Make scripts executable
        run: chmod +x download.sh setup.sh lib.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.tag }}
          generate_release_notes: true
          files: |
            download.sh
            setup.sh
            lib.sh
